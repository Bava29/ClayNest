<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClayNest</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Google Font - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body class="auth-page">


    <!-- =====================================================
         TOP ACTIONS
    ====================================================== -->

    <div class="auth-top-actions">

        <button class="auth-action" id="desktopThemeToggle" type="button" aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
        </button>


        <button class="auth-action" id="desktopRtlToggle" type="button" aria-label="Toggle RTL direction">
            <i class="fa-solid fa-right-left"></i>
        </button>

    </div>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <main class="auth-main">

        <div class="auth-card">


            <!-- Logo -->

            <a href="index.html" class="auth-logo">
                <img src="images/logo.png" alt="ClayNest">
            </a>


            <!-- Heading -->

            <div class="auth-heading">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to your ClayNest account.
                </p>

            </div>


            <!-- Login Form -->

            <form class="auth-form" action="#" method="post">


                <!-- Email -->

                <div class="auth-form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <div class="auth-input-wrap">

                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="login-email" name="email" placeholder="Enter your email"
                            autocomplete="email" required>

                    </div>

                </div>


                <!-- Password -->

                <div class="auth-form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="auth-input-wrap">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="login-password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>


                        <button type="button" class="password-toggle" data-target="login-password"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Remember + Forgot -->

                <div class="auth-options">

                    <label class="remember-me">

                        <input type="checkbox" name="remember">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                </div>


                <!-- Login -->

                <button type="submit" class="auth-submit">

                    Login

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- Divider -->

            <div class="auth-divider">

                <span>
                    or continue with
                </span>

            </div>


            <!-- Social Login -->

            <div class="social-login">


                <!-- Google -->

                <a href="#" class="social-button google" aria-label="Continue with Google">

                    <img src="images/google-logo.svg" alt="Google">

                </a>


                <!-- Facebook -->

                <a href="#" class="social-button facebook" aria-label="Continue with Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>


                <!-- Apple -->

                <a href="#" class="social-button apple" aria-label="Continue with Apple">

                    <i class="fa-brands fa-apple"></i>

                </a>

            </div>


            <!-- Register -->

            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Register now
                </a>

            </p>


        </div>

    </main>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
